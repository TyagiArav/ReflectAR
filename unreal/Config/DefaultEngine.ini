[/Script/EngineSettings.GameMapsSettings]
; Everything is spawned at runtime by AReflectARGameMode, so an empty engine map is enough.
EditorStartupMap=/Engine/Maps/Entry
GameDefaultMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/ReflectAR.ReflectARGameMode

[/Script/Engine.Engine]
; The view and projection come from the tracked eye / webcam intrinsics (UMirrorLocalPlayer).
LocalPlayerClassName=/Script/ReflectAR.MirrorLocalPlayer
bSmoothFrameRate=False

[/Script/Engine.RendererSettings]
; No environment to light or reflect: direct lights, shadows and contact shadows only.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.GenerateMeshDistanceFields=False
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
; FXAA: the cloth has no motion vectors, so TSR / TAA would smear it.
r.AntiAliasingMethod=1
r.DefaultFeature.AntiAliasing=1
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False
r.DefaultFeature.AmbientOcclusion=False

[SystemSettings]
; 30 Hz tracking: render at 60 fps, no vsync (AReflectARMirror drops to 30 fps when idle).
t.MaxFPS=60
r.VSync=0
